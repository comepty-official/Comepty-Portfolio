<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />


<!-- ── SEO ── -->
<meta name="description" content="Comepty is a youth-led digital agency that builds premium websites and apps, crafted by a 16-year-old developer with a passion for clean design and futuristic experiences." />
<meta name="keywords" content="Comepty, web development, digital agency, premium websites, Nigeria, youth developer" />
<meta name="author" content="Comepty" />

<!-- ── Open Graph (Facebook, WhatsApp, Discord, LinkedIn) ── -->
<meta property="og:title" content="Comepty.org" />
<meta property="og:description" content="Comepty is a youth-led digital agency that builds premium websites and apps, crafted by a 16-year-old developer with a passion for clean design and futuristic experiences." />
<meta property="og:image" content="https://comepty-official.github.io/Comepty-Portfolio/image/icon.png" />
<meta property="og:url" content="https://comepty-official.github.io/Comepty-Portfolio/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Comepty" />
<meta property="og:locale" content="en_US" />

<!-- ── Twitter / X ── -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Comepty.org" />
<meta name="twitter:description" content="Comepty is a youth-led digital agency that builds premium websites and apps, crafted by a 16-year-old developer with a passion for clean design and futuristic experiences." />
<meta name="twitter:image" content="https://comepty-official.github.io/Comepty-Portfolio/image/icon.png" />
<meta name="twitter:site" content="@comepty" />
<meta name="twitter:creator" content="@comepty" />

<!-- ── Discord (uses Open Graph automatically) ── -->
<!-- Discord reads og:title, og:description, og:image — already covered above -->
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- ── WhatsApp (uses Open Graph automatically) ── -->
<!-- WhatsApp reads og:title, og:description, og:image — already covered above -->

<!-- ── Telegram ── -->
<meta property="og:image:alt" content="Comepty — Building Digital Futures" />

<!-- ── LinkedIn ── -->
<meta property="article:author" content="Comepty" />


  <title>AI Assistant — Comepty</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/ai.css" />
</head>
<body>

<main class="ai-layout">

  <!-- Sidebar -->
  <aside class="ai-sidebar glass-card">
    <div class="ai-sidebar-brand">
      <div class="ai-avatar-sm"><img class="logo" src="image/icon.png" alt=""></div>
      <div>
        <div class="ai-name">Comepty AI</div>
        <div class="ai-status"><span class="status-dot"></span>Online</div>
      </div>
    </div>

    <div class="sidebar-section-label">Quick Prompts</div>
    <div class="quick-btns">
      <button class="quick-btn" data-prompt="Who is Comepty?">Who is Comepty?</button>
      <button class="quick-btn" data-prompt="What services do you offer?">What services do you offer?</button>
      <button class="quick-btn" data-prompt="How much do websites cost?">How much do websites cost?</button>
      <button class="quick-btn" data-prompt="How do I contact you?">How do I contact you?</button>
      <button class="quick-btn" data-prompt="Tell me about your projects.">Tell me about your projects.</button>
      <button class="quick-btn" data-prompt="What technologies do you use?">What technologies do you use?</button>
    </div>

    <div class="ai-disclaimer">
      This is a scripted AI assistant. For real questions, <a href="contact.html">contact us directly</a>.
    </div>
  </aside>

  <!-- Chat Window -->
  <section class="ai-chat">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="ai-avatar"><img class="logo" src="image/icon.png" alt=""></img></div>
        <div>
          <div class="chat-title">Comepty Assistant</div>
          <div class="chat-sub">Powered by Comepty AI · Scripted</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="clear-chat">Clear Chat</button>      
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages">
      <!-- Welcome message injected by JS -->
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typing-indicator" style="display:none">
      <div class="ai-avatar-xs"><img class="logo" src="image/icon.png" alt=""></div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-wrap">
      <div class="chat-input-inner glass-card">
        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="Ask me anything about Comepty..."
          autocomplete="off"
          maxlength="300"
        />
        <button class="send-btn" id="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </section>

</main>

<script src="js/shell.js"></script>
<script src="js/global.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
