<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0d1117;
    overflow:hidden;
}

.container{
    text-align:center;
    color:#fff;
    padding:30px;
    animation:float 4s ease-in-out infinite;
}

.container h1{
    font-size:10rem;
    line-height:1;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #4f8cff,
        0 0 80px #4f8cff;
}

.container h2{
    font-size:2rem;
    margin:10px 0;
}

.container p{
    max-width:500px;
    color:#b8b8b8;
    margin:15px auto;
    line-height:1.6;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    color:#fff;
    text-decoration:none;
    border:2px solid #4f8cff;
    border-radius:12px;
    transition:.3s;
}

.btn:hover{
    background:#4f8cff;
    box-shadow:0 0 25px #4f8cff;
    transform:translateY(-3px);
}

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:-1;
}

body::before{
    width:300px;
    height:300px;
    background:#4f8cff;
    top:-100px;
    left:-100px;
}

body::after{
    width:350px;
    height:350px;
    background:#6d28d9;
    bottom:-120px;
    right:-120px;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}
</style>

</body>
